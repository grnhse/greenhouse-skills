.note{color:var(--gh-muted);font-size:12px;margin:0 0 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;font-weight:700;color:var(--gh-muted);padding:8px 10px;border-bottom:1px solid var(--gh-rule);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--gh-rule);vertical-align:top}

          tr.className = 'open'; dtr = el('tr', 'detail'); var dtd = el('td'), dl = el('dl'); dtd.colSpan = span;
          det.forEach(function (d) { add(dl, el('dt', null, d.label), add(el('dd'), d.href ? link(d.value, d.href) : el('span', null, d.value))); });
          add(tbody, add(dtr, add(dtd, dl)));
        }
      });
    }
    if (D.filter && rows.some(function (r) { return r[D.filter.key] !== undefined; })) globalSubs.push({ rows: rows, set: function (v) { st.g = v; draw(); } });
    draw();
    return s;
  }

  function funnelPanel(p) {
    var s = panel(p), stages = p.stages || [];
    if (!stages.length) return empty(s, p);
    var hasRej = stages.some(function (x) { return x.rejected !== undefined; }), hasReached = stages.some(function (x) { return x.reached !== undefined; }), hasPass = stages.some(function (x) { return x.pass !== undefined; });
    var max = stages.reduce(function (a, x) { return x.scale === false ? a : Math.max(a, num(x.active), num(x.rejected)); }, 0);
    var lg = el('div', 'legend'), l1 = el('span'), i1 = el('i'); i1.style.background = 'var(--gh-s1)'; add(l1, i1, document.createTextNode(p.activeLabel || 'Active now'));
    add(lg, l1);
    if (hasRej) { var l2 = el('span'), i2 = el('i'); i2.style.background = 'var(--gh-s2)'; add(l2, i2, document.createTextNode(p.rejectedLabel || 'Rejected from here, last 30 days')); add(lg, l2); }
    add(s, lg);
    var table = el('table'), htr = el('tr'), tbody = el('tbody');
    add(htr, el('th', null, 'Stage'), el('th', null, p.unit || 'Applications'));
    if (hasReached) add(htr, el('th', 'r', p.reachedLabel || 'Reached at least (derived)'));
    if (hasPass) add(htr, el('th', 'r', 'Pass-through to next'));
    stages.forEach(function (x, i) {
      var tr = el('tr'), name = el('td'), bars = el('td', 'barcell');
      add(name, el('span', null, x.name)); if (x.flag) add(name, document.createTextNode(' '), chip({ kind: 'wait', label: x.flag })); if (x.sub) add(name, el('span', 'sub', x.sub));
      var t1 = el('div', 'track'), b1 = el('div', 'bar'); b1.style.width = '0%';
      if (x.scale === false) { add(bars, add(t1, el('span', 'num', num(x.active)), el('span', 'small muted', 'not drawn to scale'))); b1 = null; }
      else add(bars, add(t1, b1, el('span', 'num', num(x.active))));
      var b2 = null;
      if (hasRej && x.scale === false) { add(bars, el('span', 'sub', num(x.rejected) + ' ' + (p.rejectedLabel || 'rejected from here, last 30 days').toLowerCase())); }
      else if (hasRej) { var t2 = el('div', 'track'); b2 = el('div', 'bar s2'); b2.style.width = '0%'; add(bars, add(t2, b2, el('span', 'num small muted', num(x.rejected)))); }
      requestAnimationFrame(function () { if (b1) b1.style.width = pct(x.active, max) * 0.85 + '%'; if (b2) b2.style.width = pct(x.rejected, max) * 0.85 + '%'; });
      add(tr, name, bars);
      if (hasReached) add(tr, el('td', 'r', x.reached === undefined ? '—' : x.reached));
      if (hasPass) add(tr, el('td', 'r', x.pass === undefined ? '—' : x.pass));
      tbody.appendChild(tr);
    });
    add(s, add(el('div', 'scroll'), add(table, add(el('thead'), htr), tbody)));
    if (p.foot) add(s, el('p', 'note', p.foot));
    return s;
  }

  function barsPanel(p) {
    var s = panel(p), items = p.items || [];
    if (!items.length) return empty(s, p);
    var max = items.reduce(function (a, x) { return Math.max(a, num(x.value)); }, 0), table = el('table'), tbody = el('tbody');
    items.forEach(function (x) {
      var tr = el('tr'), name = el('td'), bars = el('td', 'barcell'), t = el('div', 'track'), b = el('div', 'bar');
      add(name, el('span', null, x.label)); if (x.sub) add(name, el('span', 'sub', x.sub));
      b.style.width = pct(x.value, max) * 0.85 + '%';
      add(tr, name, add(bars, add(t, b, el('span', 'num', num(x.value))))); tbody.appendChild(tr);
    });
    add(s, add(el('div', 'scroll'), add(table, tbody)));
    if (p.foot) add(s, el('p', 'note', p.foot));
    return s;
  }

  function messagePanel(p) {
    var s = panel(p), m = el('div', 'msg', p.text || '');
    add(s, m, copyBtn(m, p.copyLabel || 'Copy message'));
    if (p.foot) add(s, el('p', 'note', p.foot)).lastChild.style.marginTop = '8px';
    return s;
  }

  function listPanel(p) {
    var s = panel(p), items = p.items || [];
    if (!items.length) return empty(s, p);
    var ul = el('ul', 'items');
    items.forEach(function (x) {
      var li = el('li'), body = el('div', 'body'), c = chip(x.chip);
      if (c) add(body, c, document.createTextNode(' '));
      if (x.lead) { var b = el('b', null, x.lead); add(body, b, document.createTextNode(' ')); }
      add(body, el('span', null, x.text));
      if (x.href && safeHref(x.href)) { var open = link('Open in Greenhouse', x.href); open.className = 'small'; add(body, document.createTextNode(' '), open); }
      if (x.sub) add(body, el('span', 'sub', x.sub));
      add(li, body); if (x.copy) add(li, copyBtn(String(x.copy === true ? x.text : x.copy)));
      ul.appendChild(li);
    });
    return add(s, ul);
  }

  function stepsPanel(p) {
    var s = panel(p), row = el('div', 'steps'), ok = { done: 1, here: 1, ahead: 1 };
    (p.stages || []).forEach(function (x) {
      var d = el('div', 'step ' + (ok[x.state] ? x.state : 'ahead')), pill = el('div', 'pill', x.name);
      if (x.sub !== undefined) add(pill, el('small', null, x.sub));
      row.appendChild(add(d, pill));
    });
    add(s, row); if (p.foot) add(s, el('p', 'note', p.foot));
    return s;
  }

  function tallyPanel(p) {
    var s = panel(p), g = el('div', 'tally');
    (p.ratings || []).forEach(function (x) {
      var people = x.people || [], d = el('div');
      add(d, el('div', 'n', people.length), el('div', null, x.label), el('span', 'sub', people.join(', ') || 'nobody'));
      g.appendChild(d);
    });
    add(s, g); if (p.foot) add(s, el('p', 'note', p.foot)).lastChild.style.marginTop = '8px';
    return s;
  }

  function timelinePanel(p) {
    var s = panel(p), events = p.events || [];
    if (!events.length) return empty(s, p);
    var ul = el('ul', 'tl');
    events.forEach(function (x) {
      var li = el('li'), c = chip(x.chip);
      add(li, el('span', 'small muted', x.when), el('br'), x.href ? link(x.title, x.href) : el('span', null, x.title));
      if (c) add(li, document.createTextNode(' '), c); if (x.sub) add(li, el('span', 'sub', x.sub));
      ul.appendChild(li);
    });
    return add(s, ul);
  }

  var RENDER = { table: tablePanel, funnel: funnelPanel, bars: barsPanel, message: messagePanel, list: listPanel, steps: stepsPanel, tally: tallyPanel, timeline: timelinePanel };

  // page
  var head = el('header');
  add(head, el('div', 'kicker', 'Greenhouse data via the Greenhouse plugin · ' + (D.view || 'your view') + ' · as of ' + (D.asOf || 'time not recorded')));
  add(head, el('h1', null, D.headline || ''), el('p', 'muted', D.scope || ''));
  if (Array.isArray(D.meta) && D.meta.length) {
    var meta = el('div', 'meta');
    D.meta.forEach(function (m) { var sp = el('span'); add(sp, el('b', null, m.label), m.href ? link(m.value, m.href) : el('span', null, m.value)); meta.appendChild(sp); });
    add(head, meta);
  }
  add(root, head);
  if (Array.isArray(D.tiles) && D.tiles.length) {
    var tiles = el('div', 'tiles'), focused = false;
    D.tiles.slice(0, 4).forEach(function (t) {
      var d = el('section', 'panel tile' + (t.focus && !focused ? ' focus' : '')); if (t.focus) focused = true;
      add(d, el('div', 'small muted', t.label), el('div', 'n', t.value)); if (t.sub) add(d, el('div', 'small muted', t.sub));
      tiles.appendChild(d);
    });
    add(root, tiles);
  }
  var gbar = null;
  if (D.filter && D.filter.key) { gbar = el('div', 'controls'); add(root, gbar); }
  var grid = el('div', 'grid');
  D.panels.forEach(function (p) { var f = RENDER[p.type]; if (f) grid.appendChild(f(p)); });
  add(root, grid);
  if (gbar && globalSubs.length) {
    var counts = {}, order = [];
    globalSubs.forEach(function (sub) { sub.rows.forEach(function (r) { var k = cellText(r[D.filter.key]); if (!k) return; if (!(k in counts)) { counts[k] = 0; order.push(k); } counts[k]++; }); });
    if (order.length > 1) {
      add(gbar, el('span', 'lab', (D.filter.label || 'Show') + ':'));
      var gp = [];
      [null].concat(order).forEach(function (k) {
        var b = el('button', 'pick', k === null ? 'All' : k); b.type = 'button'; b.setAttribute('aria-pressed', k === null ? 'true' : 'false');
        b.addEventListener('click', function () { gp.forEach(function (x) { x.b.setAttribute('aria-pressed', x.k === k ? 'true' : 'false'); }); globalSubs.forEach(function (sub) { sub.set(k); }); });
        gp.push({ b: b, k: k }); gbar.appendChild(b);
      });
    }
  }
  if (Array.isArray(D.next) && D.next.length) {
    var nx = panel({ title: 'Next', note: 'Copy a prompt into the conversation to continue. This page cannot change anything in Greenhouse.' }), ul = el('ul', 'items');
    D.next.forEach(function (t) { var li = el('li'), body = el('div', 'body prompt', t); add(li, body, copyBtn(String(t))); ul.appendChild(li); });
    add(root, add(nx, ul)).lastChild.style.marginTop = '12px';
  }
  var foot = el('footer');
  if (D.judged) add(foot, el('p', null, D.judged));
  (D.notes || []).forEach(function (n) { add(foot, el('p', null, n)); });
  var aud = D.audience === 'hiring-team' ? 'Hiring team only: contains interview feedback, never for a candidate' : 'Private to you until you share it; anyone you share it with sees these rows';
  add(foot, el('p', null, 'Generated from your Greenhouse data · not an official Greenhouse screen · as of ' + (D.asOf || 'time not recorded') + ' · ' + aud + (D.cap ? ' · ' + D.cap : '')));
  add(root, foot);
})();
</script>
