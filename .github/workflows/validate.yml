name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Pinned: the gate's behaviour follows this version. Bump it with each plugin release (CONTRIBUTING, "Commits and versions").
      - run: npm install -g @anthropic-ai/claude-code@2.1.299
      - run: python3 .github/scripts/inject_shared_rules.py --check
      - run: python3 .github/scripts/lint_skills.py
      - run: claude plugin validate --strict ./greenhouse
      - run: claude plugin validate --strict .
